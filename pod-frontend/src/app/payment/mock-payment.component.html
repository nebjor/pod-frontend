<section class="pay-page">
    <header class="pay-header">
        <p class="kicker">{{ 'pay.kicker' | t }}</p>
        <h1>{{ 'pay.title' | t }}</h1>
    </header>

    <section class="card">
        <p class="hint">
            {{ 'pay.hint' | t }}
        </p>

        <dl class="details">
            <div><dt>{{ 'pay.order' | t }}</dt><dd>{{ orderNumber() }}</dd></div>
            <div class="total"><dt>{{ 'pay.amount' | t }}</dt><dd>{{ currency() }} {{ amount() | number:'1.2-2' }}</dd></div>
        </dl>

        <div class="actions">
            <button type="button" class="order-btn" [disabled]="paying() || !session()" (click)="pay()">
                @if (paying()) { {{ 'pay.confirming' | t }} } @else { {{ 'pay.simulate' | t }} }
            </button>
            <button type="button" class="order-btn ghost-btn" [disabled]="paying()" (click)="cancel()">{{ 'common.cancel' | t }}</button>
        </div>

        @if (errorMessage()) {
            <p class="error" role="alert">{{ errorMessage() }}</p>
        }
    </section>
</section>
