services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
      # Used by proxy.conf.js: the Angular dev server forwards /api to the backend container.
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/backend-slicer/Dockerfile
    working_dir: /app
    command: sh -c "mvn spring-boot:run"
    volumes:
      - ../../cad-slicer-engine:/app
      - ./public:/workspace/public:ro
      - maven_cache:/root/.m2
      # Model files of placed orders, kept outside the source tree (ADR 0003).
      - order_files:/data/order-files
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Variable names match the backend's .env.example.
      DB_URL: jdbc:postgresql://postgres:5432/slicercore
      DB_USERNAME: sliceruser
      DB_PASSWORD: slicerpassword
      SLICER_BINARY_PATH: bambu-studio-cli
      SAMPLE_MODELS_DIR: /workspace/public
      ORDER_FILES_DIR: /data/order-files
      # Payment pages redirect back to this origin; "mock" until the Stripe account is live.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PUBLIC_BASE_URL: http://localhost:4200
      # Shown to clients that hit the quote rate limit; set in your shell or a .env file.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Enables POST /api/admin/rate-limits/reset when set.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slicercore
      POSTGRES_USER: sliceruser
      POSTGRES_PASSWORD: slicerpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sliceruser -d slicercore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  maven_cache:
  postgres_data:
  order_files:
