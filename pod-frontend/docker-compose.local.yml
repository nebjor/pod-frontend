services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
      # Used by proxy.conf.js: the Angular dev server forwards /api to the backend container.
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/backend-slicer/Dockerfile
    working_dir: /app
    command: sh -c "mvn spring-boot:run"
    volumes:
      - ../../cad-slicer-engine:/app
      - ./public:/workspace/public:ro
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Variable names match the backend's .env.example.
      DB_URL: jdbc:postgresql://postgres:5432/slicercore
      DB_USERNAME: sliceruser
      DB_PASSWORD: slicerpassword
      SLICER_BINARY_PATH: bambu-studio-cli
      # Messaging stays off; the quote path is synchronous. Enable with the `full` profile when needed.
      APP_MESSAGING_ENABLED: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: slicer_mq
      RABBITMQ_PASSWORD: slicer_mq_pass
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: slicer-files
      SAMPLE_MODELS_DIR: /workspace/public
      # Shown to clients that hit the quote rate limit; set in your shell or a .env file.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Enables POST /api/admin/rate-limits/reset when set.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slicercore
      POSTGRES_USER: sliceruser
      POSTGRES_PASSWORD: slicerpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sliceruser -d slicercore"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    profiles: ["full"]
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: slicer_mq
      RABBITMQ_DEFAULT_PASS: slicer_mq_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    profiles: ["full"]
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  maven_cache:
  postgres_data:
  minio_data:
