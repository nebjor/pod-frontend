# Production stack for 3dburg.ch on one host: Caddy (HTTPS) in front of the Angular SSR
# server and the Spring backend, PostgreSQL and the order-files volume behind them.
# Both repositories are cloned side by side; see README.md in this folder. The file carries the
# default name, so inside this folder plain `docker compose up -d --build slicer-engine pod-frontend` works.
#
#   /opt/3dburg/pod-frontend        (this repository, service pod-frontend)
#   /opt/3dburg/cad-slicer-engine   (backend, service slicer-engine)
#
# Only Caddy publishes ports. Secrets come from .env next to this file (never committed).

name: 3dburg

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-3dburg.ch}
      ACME_EMAIL: ${ACME_EMAIL:-info@3dburg.ch}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pod-frontend
      - slicer-engine
    deploy:
      resources:
        limits:
          memory: 256M

  pod-frontend:
    build:
      context: ../pod-frontend
    restart: unless-stopped
    environment:
      PORT: "4000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  slicer-engine:
    build:
      context: ../../cad-slicer-engine
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-slicercore}
      ORDER_FILES_DIR: /data/order-files
      PUBLIC_BASE_URL: https://${SITE_ADDRESS:-3dburg.ch}
      # Caddy overwrites X-Forwarded-For, so the rate limiter may trust it.
      RATE_LIMIT_TRUST_FORWARDED_HEADERS: "true"
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
    volumes:
      - order_files:/data/order-files
    depends_on:
      postgres:
        condition: service_healthy
    # Two slicer slots at roughly 1 GB each plus the JVM; a runaway slice cannot take the host.
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-slicercore}
      POSTGRES_USER: ${DB_USERNAME:-sliceruser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sliceruser} -d ${DB_NAME:-slicercore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  order_files:
